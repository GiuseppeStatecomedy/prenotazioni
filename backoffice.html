<style>
  :root{--bg:#0f0f10;--card:#18181b;--line:#2a2a2f;--txt:#f4f4f5;--mut:#a1a1aa;--acc:#E1B655;--err:#ff6b6b;--ok:#4ade80;--warn:#fbbf24;--info:#60a5fa}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Inter,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
  h1{font-size:20px;margin:6px 0 14px}
  .login{max-width:320px;margin:20vh auto 0;text-align:center}
  .login input{font-size:28px;letter-spacing:10px;text-align:center}
  input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font:16px system-ui,sans-serif}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{min-height:70px;resize:vertical}
  button{font:600 15px system-ui,sans-serif;border-radius:10px;border:0;padding:11px 14px;cursor:pointer;background:var(--acc);color:#111}
  button.sec{background:var(--card);color:var(--txt);border:1.5px solid var(--line)}
  button.sm{padding:7px 10px;font-size:13px}
  button.danger{background:transparent;color:var(--err);border:1.5px solid #ff6b6b55}
  button[disabled]{opacity:.5}
  .tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
  .tabs button{flex:1;background:var(--card);color:var(--mut);border:1.5px solid var(--line)}
  .tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
  .bar{display:flex;gap:8px;margin:8px 0}
  .bar input{flex:1}
  .bar select{width:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .nm{font-weight:700;font-size:16px}
  .mut{color:var(--mut);font-size:13px}
  .id{font:600 13px ui-monospace,Menlo,monospace;color:var(--acc)}
  .tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .t-Pagato{background:#14532d;color:var(--ok)}
  .t-In{background:#422006;color:var(--warn)}
  .t-Da{background:#1e3a5f;color:var(--info)}
  .t-Annullata{background:#3f1d1d;color:var(--err)}
  .in{background:#14532d;color:var(--ok)}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .det{margin-top:8px;font-size:13px;color:var(--mut);display:none}
  .det.show{display:block}
  .det b{color:var(--txt);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi b{display:block;font-size:26px}
  .kpi span{color:var(--mut);font-size:13px}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-size:12px;text-transform:uppercase;font-weight:600}
  td.r,th.r{text-align:right}
  h3{font-size:15px;margin:18px 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
  .f{margin-bottom:10px}
  .f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--mut)}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .item .row{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px}
  .chk input{width:20px;height:20px;accent-color:var(--acc)}
  .algs{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0 8px}
  .algs .chk{font-size:13px}
  .item .lbl{font-size:12px;color:var(--mut);font-weight:600;margin:4px 0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:12px 18px;border-radius:12px;z-index:9;display:none;max-width:90vw}
  .hidden{display:none!important}
  .empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>

<div id="app" class="wrap hidden">
  <div class="top"><h1 id="evTitle">Backoffice</h1><button class="sec sm" onclick="load()">↻ Aggiorna</button></div>

    <h3>Evento</h3>
    <div class="f"><label>Titolo</label><input data-k="evento_titolo"></div>
    <div class="f"><label>Sottotitolo</label><input data-k="evento_sottotitolo"></div>
    <div class="f"><label>Data (testo libero)</label><input data-k="evento_data"></div>
    <div class="f"><label>Orario</label><input data-k="evento_ora"></div>
    <div class="f"><label>Luogo</label><input data-k="evento_luogo"></div>

    <div class="f"><label>Descrizione</label><textarea data-k="evento_descrizione"></textarea></div>

function api(params) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const t = setTimeout(() => { clean(); reject(new Error('Il server non risponde')); }, 25000);
    function clean() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { clean(); resolve(d); };
    s.onerror = () => { clean(); reject(new Error('Errore di connessione')); };
    s.src = API_URL + '?' + new URLSearchParams({ ...params, pin: PIN, callback: cb, _: Date.now() });
    document.body.appendChild(s);
  });
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

/* ---------- LOGIN ---------- */
try { PIN = sessionStorage.getItem('sc_pin') || ''; } catch (_) {}
if (PIN) load();
$('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  PIN = $('#pin').value.trim();
  try {
    const r = await api({ action: 'login' });
    if (!r.ok) throw new Error(r.error);
    try { sessionStorage.setItem('sc_pin', PIN); } catch (_) {}
    load();
  } catch (e) { $('#loginErr').textContent = e.message; }
}

async function load() {
  try {
    const r = await api({ action: 'list' });
    if (!r.ok) throw new Error(r.error);
    ROWS = r.rows.reverse(); CFG = r.config;
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    $('#evTitle').textContent = CFG.evento_titolo || 'Backoffice';
    renderList(); renderSum(); fillCfg();
  } catch (e) {
    try { sessionStorage.removeItem('sc_pin'); } catch (_) {}
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    $('#loginErr').textContent = e.message;
  }
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['list', 'sum', 'cfg'].forEach(t => $('#t-' + t).classList.toggle('hidden', t !== b.dataset.t));
});

/* ---------- LISTA ---------- */
$('#q').addEventListener('input', renderList);
$('#fs').addEventListener('change', renderList);
function renderList() {
  const q = $('#q').value.trim().toLowerCase(), f = $('#fs').value;
  const list = ROWS.filter(r => {
    if (f === '_in' ? !r['Check-in'] : (f && r['Stato'] !== f)) return false;
    if (!q) return true;
    return [r['ID'], r['Nome'], r['Cognome'], r['Telefono'], r['Email'], r['Codice fiscale']].join(' ').toLowerCase().includes(q);
  });
  $('#cnt').textContent = list.length + ' prenotazioni';
  $('#rows').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Nessuna prenotazione</div>';
}
function card(r) {
  const st = r['Stato'] || 'In attesa', id = esc(r['ID']);
  const food = r['Pacchetto'] ? '<div class="mut">🍽 ' + esc(r['Pacchetto']) + (r['Drink'] && r['Drink'] !== 'Incluso' ? ' · 🍹 ' + esc(r['Drink']) : '') + '</div>' : '';
  return '<div class="card"><div class="top"><div><div class="nm">' + esc(r['Nome'] + ' ' + r['Cognome']) + '</div>' +
    '<div class="id">' + id + '</div></div><div style="text-align:right"><span class="tag t-' + esc(st.split(' ')[0]) + '">' + esc(st) + '</span>' +
    (r['Check-in'] ? '<br><span class="tag in" style="margin-top:4px">Entrato ' + esc(String(r['Check-in']).slice(11)) + '</span>' : '') + '</div></div>' +
    '<div class="mut" style="margin-top:6px">🎟 ' + esc(r['Biglietto']) + ' · €' + esc(r['Prezzo']) + '</div>' + food +
    (r['Allergie / note'] ? '<div style="margin-top:4px;color:var(--warn);font-size:13px">⚠️ ' + esc(r['Allergie / note']) + '</div>' : '') +
    '<div class="det' + (OPEN.has(r['ID']) ? ' show' : '') + '">📞 <b>' + esc(r['Telefono']) + '</b> · ✉️ <b>' + esc(r['Email']) + '</b><br>CF <b>' + esc(r['Codice fiscale']) +
    '</b><br>Nato/a il ' + esc(r['Data nascita']) + ' a ' + esc(r['Luogo nascita']) + '<br>Prenotato il ' + esc(r['Data prenotazione']) +
    (r['Stripe session'] ? '<br>Stripe: ' + esc(r['Stripe session']) : '') + (r['Email inviata'] ? '<br>Email conferma inviata: ' + esc(r['Email inviata']) : '') + '</div>' +
    '<div class="acts">' +
    (st !== 'Pagato' ? '<button class="sm" onclick="setStato(\'' + id + '\',\'Pagato\')">✓ Pagato</button>' : '') +
    (r['Check-in'] ? '<button class="sec sm" onclick="checkin(\'' + id + '\',\'NO\')">Annulla ingresso</button>'
                   : '<button class="sec sm" onclick="checkin(\'' + id + '\',\'SI\')">→ Segna ingresso</button>') +
    '<button class="sec sm" onclick="toggleDet(\'' + id + '\')">Dettagli</button>' +
    (st !== 'Annullata' ? '<button class="danger sm" onclick="setStato(\'' + id + '\',\'Annullata\')">Annulla</button>'
                        : '<button class="sec sm" onclick="setStato(\'' + id + '\',\'In attesa\')">Ripristina</button>') +
    '</div></div>';
}
function toggleDet(id) { OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id); renderList(); }

async function setStato(id, v) {
  if (v === 'Annullata' && !confirm('Annullare la prenotazione ' + id + '? Il posto torna libero.')) return;
  if (v === 'Pagato') {
    const r = ROWS.find(x => x['ID'] === id);
    if (r && r['Stato'] === 'In attesa' && !confirm('Confermi di aver verificato il pagamento di ' + r['Nome'] + ' su Stripe?')) return;
  }
  await upd(id, 'stato', v);
}
async function checkin(id, v) {
  const r = ROWS.find(x => x['ID'] === id);
  if (v === 'SI' && r && r['Stato'] !== 'Pagato' && !confirm('Attenzione: questa prenotazione risulta "' + r['Stato'] + '". Far entrare comunque?')) return;
  await upd(id, 'checkin', v);
}
async function upd(id, field, value) {
  try {
    const r = await api({ action: 'update', id, field, value });
    if (!r.ok) throw new Error(r.error);
    const i = ROWS.findIndex(x => x['ID'] === id);
    if (i >= 0) ROWS[i] = r.row;
    renderList(); renderSum(); toast('Salvato');
  } catch (e) { alert(e.message); }
}

/* ---------- RIEPILOGO ---------- */
function renderSum() {
  const act = ROWS.filter(r => r['Stato'] !== 'Annullata');
  const paid = act.filter(r => r['Stato'] === 'Pagato');
  const incasso = paid.reduce((s, r) => s + (Number(r['Prezzo']) || 0), 0);
  const cap = parseInt(CFG.capienza || '0', 10) || 0;
  const count = (arr, k) => arr.reduce((m, r) => { if (r[k]) m[r[k]] = (m[r[k]] || 0) + 1; return m; }, {});
  const table = (title, obj) => {
    const keys = Object.keys(obj).sort((a, b) => obj[b] - obj[a]);
    return '<h3>' + title + '</h3>' + (keys.length ? '<table>' + keys.map(k => '<tr><td>' + esc(k) + '</td><td class="r"><b>' + obj[k] + '</b></td></tr>').join('') + '</table>' : '<p class="mut">Nessun dato</p>');
  };
  $('#t-sum').innerHTML =
    '<div class="grid">' +
    '<div class="kpi"><b>' + act.length + (cap ? '<small class="mut" style="font-size:15px"> / ' + cap + '</small>' : '') + '</b><span>Prenotazioni attive</span></div>' +
    '<div class="kpi"><b>' + paid.length + '</b><span>Pagate</span></div>' +
    '<div class="kpi"><b>€' + incasso.toLocaleString('it-IT') + '</b><span>Incassato (pagate)</span></div>' +
    '<div class="kpi"><b>' + ROWS.filter(r => r['Check-in']).length + '</b><span>Entrati</span></div></div>' +
    '<p class="mut">In attesa: ' + act.filter(r => r['Stato'] === 'In attesa').length + ' · Da verificare: ' + act.filter(r => r['Stato'] === 'Da verificare').length + ' · Annullate: ' + (ROWS.length - act.length) + '</p>' +
    table('Biglietti (pagati)', count(paid, 'Biglietto')) +
    table('Pacchetti food (pagati)', count(paid, 'Pacchetto')) +
    (CFG.drink_scelta === 'SI' ? table('Drink (pagati)', count(paid, 'Drink')) : '') +
    '<h3>Allergie e note</h3>' + (paid.filter(r => r['Allergie / note']).map(r => '<div class="card"><b>' + esc(r['Nome'] + ' ' + r['Cognome']) + '</b> <span class="mut">' + esc(r['Pacchetto'] || '') + '</span><br>' + esc(r['Allergie / note']) + '</div>').join('') || '<p class="mut">Nessuna</p>');
}

/* ---------- IMPOSTAZIONI ---------- */
let BIG = [], PAC = [];
function parse(k) { try { return JSON.parse(CFG[k] || '[]'); } catch (_) { return []; } }
function fillCfg() {
  document.querySelectorAll('[data-k]').forEach(el => el.value = CFG[el.dataset.k] || (el.type === 'color' ? '#E1B655' : ''));
  BIG = parse('biglietti'); PAC = parse('pacchetti');
  $('#edDrink').value = parse('drink').join('\n');
  $('#drinkOpts').classList.toggle('hidden', (CFG.drink_scelta || 'NO') !== 'SI');
  drawBig(); drawPac();
}
function drawBig() {
  $('#edBiglietti').innerHTML = BIG.map((b, i) =>
    '<div class="item"><div class="row"><input placeholder="Nome biglietto" value="' + esc(b.nome) + '" oninput="BIG[' + i + '].nome=this.value">' +
    '<input placeholder="Prezzo €" inputmode="decimal" value="' + esc(b.prezzo) + '" oninput="BIG[' + i + '].prezzo=this.value"></div>' +
    '<div class="f"><input placeholder="Descrizione" value="' + esc(b.descrizione) + '" oninput="BIG[' + i + '].descrizione=this.value"></div>' +
    '<div class="f"><input placeholder="Link Stripe (https://buy.stripe.com/…)" value="' + esc(b.stripe) + '" oninput="BIG[' + i + '].stripe=this.value"></div>' +
    '<div class="top"><label class="chk"><input type="checkbox"' + (b.food ? ' checked' : '') + ' onchange="BIG[' + i + '].food=this.checked">Include food + drink (chiede pacchetto e drink)</label>' +
    '<button class="danger sm" onclick="BIG.splice(' + i + ',1);drawBig()">Elimina</button></div></div>').join('');
}
function drawPac() {
  $('#edPacchetti').innerHTML = PAC.map((p, i) => {
    const al = Array.isArray(p.allergeni) ? p.allergeni.join(', ') : (p.allergeni || '');
    return '<div class="item"><div class="lbl">Nome pacchetto</div><div class="f"><input placeholder="Es. Poke" value="' + esc(p.nome) + '" oninput="PAC[' + i + '].nome=this.value"></div>' +
    '<div class="lbl">Ingredienti / descrizione</div><div class="f"><textarea style="min-height:120px" placeholder="Cosa contiene (vai a capo per ogni voce)" oninput="PAC[' + i + '].descrizione=this.value">' + esc(p.descrizione) + '</textarea></div>' +
    '<div class="lbl">Allergeni (testo libero, vuoto = non mostrato)</div><div class="f"><textarea placeholder="Es. contiene pesce, crostacei, soia, sesamo" oninput="PAC[' + i + '].allergeni=this.value">' + esc(al) + '</textarea></div>' +
    '<div class="top"><div>' + (i > 0 ? '<button class="sec sm" onclick="movePac(' + i + ',-1)">↑</button> ' : '') + (i < PAC.length - 1 ? '<button class="sec sm" onclick="movePac(' + i + ',1)">↓</button>' : '') + '</div>' +
    '<button class="danger sm" onclick="if(confirm(\'Eliminare il pacchetto?\')){PAC.splice(' + i + ',1);drawPac()}">Elimina</button></div></div>';
  }).join('');
}
function movePac(i, d) { const t = PAC[i]; PAC[i] = PAC[i + d]; PAC[i + d] = t; drawPac(); }
function uid(p) { return p + Math.random().toString(36).slice(2, 7); }
function addBiglietto() { BIG.push({ id: uid('b'), nome: '', prezzo: '', descrizione: '', stripe: '', food: false }); drawBig(); }
function addPacchetto() { PAC.push({ id: uid('p'), nome: '', descrizione: '', allergeni: '' }); drawPac(); }

async function saveCfg() {
  const btn = $('#saveBtn');
  const bad = BIG.find(b => !b.nome.trim() || !String(b.prezzo).trim()) || PAC.find(p => !p.nome.trim());
  if (bad) return alert('Ogni biglietto deve avere nome e prezzo, ogni pacchetto un nome.');
  const linkBad = BIG.find(b => b.stripe && !/^https:\/\/(buy\.stripe\.com|checkout\.stripe\.com)\//.test(b.stripe.trim()));
  if (linkBad) return alert('Il link Stripe di "' + linkBad.nome + '" non sembra valido (deve iniziare con https://buy.stripe.com/).');
  const changes = {};
  document.querySelectorAll('[data-k]').forEach(el => { if ((CFG[el.dataset.k] || '') !== el.value) changes[el.dataset.k] = el.value; });
  const j = { biglietti: JSON.stringify(BIG.map(b => ({ ...b, stripe: (b.stripe || '').trim() }))), pacchetti: JSON.stringify(PAC),
    drink: JSON.stringify($('#edDrink').value.split('\n').map(s => s.trim()).filter(Boolean)) };
  Object.keys(j).forEach(k => { if (CFG[k] !== j[k]) changes[k] = j[k]; });
  const keys = Object.keys(changes);
  if (!keys.length) return toast('Nessuna modifica');
  btn.disabled = true;
  try {
    for (let i = 0; i < keys.length; i++) {
      btn.textContent = 'Salvataggio ' + (i + 1) + '/' + keys.length + '…';
      const r = await api({ action: 'setConfig', key: keys[i], value: changes[keys[i]] });
      if (!r.ok) throw new Error(r.error);
      CFG[keys[i]] = changes[keys[i]];
    }
    toast('Impostazioni salvate');
    $('#evTitle').textContent = CFG.evento_titolo || 'Backoffice';
    renderSum();
  } catch (e) { alert('Errore: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Salva impostazioni';
}

async function changePin() {
  const np = $('#newPin').value.trim();
  if (!/^\d{4,8}$/.test(np)) return alert('Il PIN deve avere da 4 a 8 cifre');
  try {
    const r = await api({ action: 'setPin', newPin: np });
    if (!r.ok) throw new Error(r.error);
    PIN = np; try { sessionStorage.setItem('sc_pin', PIN); } catch (_) {}
    $('#newPin').value = ''; toast('PIN aggiornato');
  } catch (e) { alert(e.message); }
}
</script>
</body>
</html>
